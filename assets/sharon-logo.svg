<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 50 900 900" width="1000" height="1000" role="img" aria-labelledby="title description">
  <title id="title">Sharon — gereconstrueerd vectorlogo</title>

  <desc id="description">Optische reconstructie uit Logo_365S, op basis van de aangeleverde schermopname. Een brede binnenring, vier dunne buitenbogen, een schuine balk en een kleine sikkel bij het middelpunt. Verhoudingen zijn uit de opname afgeleid, niet uit een origineel vectorbestand. Alle uitsparingen zijn transparant. De geometrie is opgebouwd uit cirkels, rechthoeken en maskers."</desc>
  <defs>


    <clipPath id="inner-ring-cut" clipPathUnits="userSpaceOnUse"><path clip-rule="evenodd" transform="rotate(-32)" d="M-700-700 H700 V700 H-700 Z M0-53 H480 V53 H0 Z"/></clipPath>
    <clipPath id="outer-segments" clipPathUnits="userSpaceOnUse">

      <rect x="-440" y="-440" width="880" height="157"/>
      <rect x="-440" y="-204" width="157" height="487"/>
      <rect x="283" y="-172" width="157" height="455"/>
      <rect x="-200" y="283" width="400" height="157"/>
      <rect transform="rotate(45)" x="-200" y="-80" width="400" height="60"/>
    </clipPath>
    <clipPath id="beam-center-cut" clipPathUnits="userSpaceOnUse"><path clip-rule="evenodd" d="M-700-700 H700 V700 H-700 Z M71 0 A71 71 0 1 0 -71 0 A71 71 0 1 0 71 0 Z"/></clipPath>


  </defs>

  <g id="logo" transform="translate(500 500)" color="#171a23" fill="currentColor">
    <g id="outer-arcs" clip-path="url(#outer-segments)">
      <circle r="391" fill="none" stroke="currentColor" stroke-width="18"/>
    </g>
    <g id="inner-ring" clip-path="url(#inner-ring-cut)">
      <circle r="343" fill="none" stroke="currentColor" stroke-width="37"/>
    </g>
    <g id="diagonal-beam" clip-path="url(#beam-center-cut)">
      <rect x="0" y="-18.5" width="430" height="37" transform="rotate(-32)"/>
    </g>
    <g id="center-crescent"  clip-path="url(#outer-segments)">
      <circle r="72" fill="none" stroke="currentColor" stroke-width="8"/>
    </g>
  </g>
</svg>
